<!--
  Sign In Page - Authentication Foundation

  Provides the sign-in form for user authentication, sending credentials
  via HTTP to the n8n authentication webhook.

  Route:    / or /index.html
  Trigger:  User sign-in attempt
  Auth:     n8n Backend Authentication Webhook
-->
<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In</title>
  <meta name="description" content="Sign in to your account.">
  <link rel="stylesheet" href="css/style.css">
</head>

<body class="auth-body">

  <main class="auth-container">
    <div class="auth-card">

      <header class="auth-header">
        <h1>Sign In</h1>
        <p>Enter your credentials to access your account</p>
      </header>

      <form id="signInForm" novalidate>

        <!-- Email Field -->
        <div class="form-group">
          <label for="email" class="form-label">Email Address</label>
          <input type="email" id="email" name="email" class="form-input" placeholder="user@example.com" required
            autocomplete="email">
        </div>

        <!-- Password Field -->
        <div class="form-group">
          <label for="password" class="form-label">Password</label>
          <input type="password" id="password" name="password" class="form-input font-mono" placeholder="••••••••••••"
            required autocomplete="current-password">
        </div>

        <!-- Submit Button -->
        <button type="submit" id="submitBtn" class="btn-submit">
          <span class="spinner" aria-hidden="true"></span>
          <span id="btnText">Sign In</span>
        </button>

      </form>

      <!-- Feedback Alert State -->
      <div id="alertBox" class="alert-box" role="alert" aria-live="polite"></div>

      <!-- Switch to Sign Up -->
      <div class="auth-switch">
        Don't have an account? <a href="signup.html">Sign Up</a>
      </div>

    </div>

    <footer class="auth-footer">
      <p>Authentication powered by n8n backend</p>
    </footer>
  </main>

  <script src="js/config.js"></script>
  <script src="js/signin.js"></script>
</body>

</html>
