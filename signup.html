<!--
  Sign Up Page - Authentication Foundation

  Provides the registration form for new users, sending account credentials
  via HTTP to the n8n registration webhook for backend validation.

  Route:    /signup.html
  Trigger:  User sign-up attempt
  Auth:     n8n Backend Registration Webhook
-->
<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign Up</title>
  <meta name="description" content="Create a new account.">
  <link rel="stylesheet" href="css/style.css">
</head>

<body class="auth-body">

  <main class="auth-container">
    <div class="auth-card">

      <header class="auth-header">
        <h1>Create Account</h1>
        <p>Sign up for a new account</p>
      </header>

      <form id="signUpForm" novalidate>

        <!-- Email Field -->
        <div class="form-group">
          <label for="email" class="form-label">Email Address</label>
          <input type="email" id="email" name="email" class="form-input" placeholder="user@example.com" required
            autocomplete="email">
        </div>

        <!-- Password Field -->
        <div class="form-group">
          <label for="password" class="form-label">Password</label>
          <input type="password" id="password" name="password" class="form-input font-mono" placeholder="••••••••••••"
            required minlength="8" autocomplete="new-password">
        </div>

        <!-- Confirm Password Field -->
        <div class="form-group">
          <label for="confirmPassword" class="form-label">Confirm Password</label>
          <input type="password" id="confirmPassword" name="confirmPassword" class="form-input font-mono"
            placeholder="••••••••••••" required minlength="8" autocomplete="new-password">
        </div>

        <!-- Submit Button -->
        <button type="submit" id="submitBtn" class="btn-submit">
          <span class="spinner" aria-hidden="true"></span>
          <span id="btnText">Create Account</span>
        </button>

      </form>

      <!-- Feedback Alert State -->
      <div id="alertBox" class="alert-box" role="alert" aria-live="polite"></div>

      <!-- Switch to Sign In -->
      <div class="auth-switch">
        Already have an account? <a href="index.html">Sign In</a>
      </div>

    </div>

    <footer class="auth-footer">
      <p>Account creation powered by n8n backend</p>
    </footer>
  </main>

  <script src="js/config.js"></script>
  <script src="js/signup.js"></script>
</body>

</html>
